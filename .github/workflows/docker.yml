name: Publish Docker image

# Disabled in this fork. The job below is guarded on the repository, so it
# still runs for upstream and is skipped everywhere else.
#
# It was failing on every branch push: the `push` trigger has no branch filter,
# and the Docker Hub login reads secrets.DOCKER_USERNAME / DOCKER_TOKEN, which
# are eartharoid's and do not exist here. On pull_request the login steps are
# skipped, so it got as far as building two platforms under QEMU instead --
# several minutes of work for an image this fork never uses, since it deploys
# from source with deploy.yml.
#
# Guarding rather than deleting the file keeps the diff against upstream to one
# line, and keeps the workflow intact should this fork ever want to publish its
# own image: swap the condition for the fork's own name and set the secrets.

on:
  push:
    # branches:
    #   - 'main'
    # tags:
    #   - 'v*'
  pull_request:
    branches:
      - 'main'

jobs:
  push_to_registries:
    name: Push Docker image to multiple registries
    # Upstream only; a skipped job reports neutral rather than failing.
    if: github.repository == 'discord-tickets/bot'
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Log in to the Container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: |
            eartharoid/discord-tickets
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker images
        uses: docker/build-push-action@v4
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
