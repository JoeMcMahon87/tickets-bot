logs:
  files:
    directory: ./logs
    enabled: true
    keepFor: 30
  level: info
presence:
  activities:
    - name: /new
    - name: with {totalTickets} tickets
    - name: "{openTickets} tickets"
      type: 3
    - name: "{avgResponseTime} response time"
      type: 3
    - name: "{avgRating} ⭐ rating"
      type: 3
  interval: 20
  status: online
# Anonymous usage reporting to Houston, upstream's stats service at
# discordtickets.app. Off in this fork.
#
# It is a POST on boot and every 12 hours. It has also been erroring on every
# run here -- "the response couldn't be parsed: res.json is not a function" --
# which upstream's own handler prefaces with "The following error is not
# important and can be safely ignored", so the only thing it produced was a
# stack trace in the journal twice a day.
#
# This disables nothing else. The averages shown in the bot's presence and in
# transcripts come from src/lib/stats.js and its worker pool, which are not
# gated on this setting.
stats: false
templates:
  transcript: transcript.md
transcripts:
  # Post a ticket's transcript to a channel when it is closed.
  #
  # QUOTE THE ID. A bare Discord ID is read as a number, and snowflakes are
  # too large for one to hold exactly, so an unquoted value is silently not
  # the channel you typed. The bot refuses it and warns rather than hunting
  # for a channel that cannot exist.
  #
  # One channel for every guild:
  #   onClose: "123456789012345678"
  # or one per guild, keyed by guild ID:
  #   onClose:
  #     "987654321098765432": "123456789012345678"
  #
  # The bot needs View Channel, Send Messages, Embed Links and Attach Files
  # there. Leave it null to post nothing.
  onClose: null
updates: true
